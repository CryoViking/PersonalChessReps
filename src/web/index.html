<!DOCTYPE html>
<meta charset="utf-8">

<div class="layout">
  <div id="board" class="board">
    <div class="board-squares"></div>
    <div class="board-highlights"></div>
    <div class="board-pieces"></div>
    <svg class="board-arrows" viewBox="0 0 8 8" aria-hidden="true">
      <g class="arrow-lines"></g>

        <path d="M4 12 a8 8 0 0 1 14.9-4" />
        <polyline points="19 3 19 8 14 8" />
        <polyline points="5 21 5 16 10 16" />

  </div>
</div>
