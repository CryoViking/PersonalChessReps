<!DOCTYPE html>
<meta charset="utf-8">

<nav class="sidebar" aria-label="Main menu">
  <button type="button" id="reset-board" class="sidebar-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M4.6 15 a8 8 0 1 0 1.6 -8.5" />
      <polyline points="4 3 5.5 7.5 10 6" />
    </svg>
    <span>Reset board</span>
  </button>
</nav>

<div class="layout">
  <div class="board-area">
    <div class="board-frame">
      <div id="board" class="board">
        <div class="board-squares"></div>
        <div class="board-highlights"></div>
        <div class="board-pieces"></div>
        <svg class="board-arrows" viewBox="0 0 8 8" aria-hidden="true">
          <g class="arrow-lines"></g>
        </svg>
        <div class="board-drag"></div>
        <div class="board-promotion"></div>
      </div>

      <div class="board-controls">
        <button type="button" id="flip-button" class="icon-button" title="Flip board (F)" aria-label="Flip board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M20 12 a8 8 0 0 1 -14.9 4" />
            <path d="M4 12 a8 8 0 0 1 14.9-4" />
            <polyline points="19 3 19 8 14 8" />
            <polyline points="5 21 5 16 10 16" />
          </svg>
        </button>
        <button type="button" id="resize-handle" class="icon-button resize-handle" title="Drag to resize the board"
          aria-label="Resize board">
          <svg ViewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M5 5 19 19" />
            <polyline points="5 11 5 5 11 5" />
            <polyline points="19 13 19 19 13 19" />
          </svg>
        </button>
      </div>
    </div>

    <aside class="side-panel" aria-label="Moves">
      <div class="move-list"></div>

      <div class="move-nav">
        <button type="button" id="nav-first" class="nav-button" title="First move (Home)" aria-label="First move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M7 6v12" />
            <polyline points="17 6 11 12 17 18" />
          </svg>
        </button>
        <button type="button" id="nav-prev" class="nav-button" title="Previous move (←)" aria-label="Previous move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 6 9 12 15 18" />
          </svg>
        </button>
        <button type="button" id="nav-next" class="nav-button" title="Next move (→)" aria-label="Next move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 6 15 12 9 18" />
          </svg>
        </button>
        <button type="button" id="nav-last" class="nav-button" title="Last move (End)" aria-label="Last move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <polyline points="7 6 13 12 7 18" />
            <path d="M17 6v12" />
          </svg>
        </button>
      </div>
    </aside>
  </div>
</div>



<script type="module" src="./ts/main.ts"></script>
